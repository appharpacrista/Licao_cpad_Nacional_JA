 {t:'label', x:'Leitura Bíblica em Classe.'},
 {t:'versehead', x:'Atos, capítulo 18, versículos 1 a 11.'},

 {t:'verse', x:'Versículo 2. E, achando um certo judeu por nome Áquila, natural do Ponto, que havia pouco tinha vindo da Itália, e Priscila, sua mulher, pois Cláudio tinha mandado que todos os judeus saíssem de Roma, se ajuntou com eles.'},
 {t:'verse', x:'Versículo 3. E, como era do mesmo ofício, ficou com eles e trabalhava; pois tinham por ofício fazer tendas.'},

 {t:'verse', x:'Versículo 5. Quando Silas e Timóteo desceram da Macedônia, foi Paulo impulsionado pela palavra, testificando aos judeus que Jesus era o Cristo.'},
 {t:'verse', x:'Versículo 6. Mas, resistindo e blasfemando eles, sacudiu as vestes e disse-lhes: O vosso sangue seja sobre a vossa cabeça; eu estou limpo e, desde agora, parto para os gentios.'},
 {t:'verse', x:'Versículo 7. E, saindo dali, entrou em casa de um homem chamado Tito Justo, que servia a Deus e cuja casa estava junto da sinagoga.'},
 {t:'verse', x:'Versículo 8. E Crispo, principal da sinagoga, creu no Senhor com toda a sua casa; também muitos dos coríntios, ouvindo-o, creram e foram batizados.'},
 {t:'verse', x:'Versículo 9. E disse o Senhor, em visão, a Paulo: Não temas, mas fala e não te cales.'},
 {t:'verse', x:'Versículo 10. Porque eu sou contigo, e ninguém lançará mão de ti para te fazer mal, pois tenho muito povo nesta cidade.'},
 {t:'verse', x:'Versículo 11. E ficou ali um ano e seis meses, ensinando entre eles a palavra de Deus.'},
 {t:'body', x:'Hinos sugeridos: setenta e nove, oitenta e nove, e duzentos e cinco, da Harpa Cristã.'},

 {t:'divider', x:'Plano de Aula'},
 {t:'subtopic', x:'1. Introdução.'},
 {t:'body', x:'O estudo desta lição nos convida a uma leitura madura e reflexiva da experiência de Paulo em Corinto, integrando fé, contexto e vida. Considerando que a aprendizagem ocorre na interação entre experiências pessoais e a ação formadora da Palavra, este plano valoriza o diálogo e a aplicação consciente da Palavra. Ao reconhecer desafios, medos e decisões do apóstolo, o aluno é levado a reinterpretar sua própria caminhada à luz da suficiência da graça de Deus, fortalecendo a fé e o compromisso cristão.'},

 {t:'subtopic', x:'2. Apresentação da Lição.'},
 {t:'body', x:'Objetivos da Lição. Primeiro, conduzir o aluno a compreender Corinto e os desafios do Evangelho. Segundo, verificar com o aluno a missão de Paulo e a suficiência da graça. Terceiro, conscientizar sobre a graça de Deus diante dos desafios da vida cristã.'},
 {t:'body', x:'Motivação. Estudar a experiência de Paulo em Corinto permite compreender que a missão cristã não se sustenta na força humana, mas na graça de Deus. Esse tema fortalece a fé, orienta a prática cristã e ajuda o aluno a interpretar desafios pessoais e ministeriais à luz da fidelidade divina.'},
 {t:'body', x:'Sugestão de Método. Para introduzir o primeiro tópico, o professor pode iniciar a aula apresentando um panorama histórico, social e religioso da cidade de Corinto, situando o aluno no contexto em que Paulo desenvolveu seu ministério. Por meio de uma breve exposição dialogada, destaque o contraste entre riqueza material e decadência moral, estimulando o aluno a perceber como o ambiente influencia a nossa jornada de fé. Em seguida, apresente a estratégia inicial de Paulo ao pregar na sinagoga, convidando a classe a refletir sobre desafios, resistências e a necessidade de depender da graça divina em contextos adversos. Use a Bíblia de Estudo Pentecostal, Edição Global, editada pela CPAD, para enriquecer seu plano de aula.'},

 {t:'subtopic', x:'3. Conclusão da Lição.'},
 {t:'body', x:'Aplicação. A vida cristã é sustentada pela graça de Deus em meio às pressões e fragilidades. Assim como Paulo, o crente aprende a confiar na presença do Senhor, perseverar diante das dificuldades e servir com fidelidade, mesmo em contextos moral e espiritualmente desafiadores.'},

 {t:'subtopic', x:'4. Subsídio ao Professor.'},
 {t:'body', x:'Revista Ensinador Cristão. Vale a pena conhecer essa revista que traz reportagens, artigos, entrevistas e subsídios de apoio à Lições Bíblicas Adultos. Na edição cento e seis, página trinta e nove, você encontrará um subsídio especial para esta lição.'},
 {t:'body', x:'Auxílios Especiais. Ao final do tópico, você encontrará auxílios que darão suporte na preparação de sua aula. Primeiro, o texto Corinto, localizado depois do primeiro tópico, remonta o contexto religioso e moral da cidade de Corinto. Segundo, o texto Porque Eu Sou Contigo, localizado ao final do segundo tópico, aprofunda o aspecto encorajador do Evangelho ao ministério do apóstolo Paulo.'},

 {t:'divider', x:'Comentário'},
 {t:'label', x:'Introdução.'},
 {t:'body', x:'A fundação da igreja em Corinto, narrada em Atos, capítulo 18, revela um momento decisivo da missão cristã, no qual a graça de Deus se mostra plenamente suficiente em meio a adversidades intensas. Em uma cidade marcada pela imoralidade e pelo pluralismo religioso, o apóstolo Paulo experimenta o sustento divino para perseverar e anunciar o Evangelho com fidelidade. Este episódio ensina que, mesmo em contextos desafiadores, a graça do Senhor capacita seus servos a permanecer firmes e frutíferos.'},

 {t:'label', x:'Palavra-chave.'},
 {t:'body', x:'Suficiência.'},

 {t:'topic', x:'Tópico 1. Paulo Chega a Corinto. Atos, capítulo 18, versículos 1 a 6.'},
 {t:'subtopic', x:'1. Corinto: riqueza material e miséria espiritual.'},
 {t:'body', x:'Após deixar Atenas, Paulo chega a Corinto, capital da província romana da Acaia desde vinte e sete antes de Cristo. A cidade havia superado Atenas em importância política e comercial, tornando-se um dos maiores centros econômicos do mundo romano. Cosmopolita e estrategicamente localizada, Corinto reunia povos de diversas culturas, mas também se destacava por sua profunda decadência moral. Templos pagãos, especialmente o de Afrodite, marcavam a vida religiosa da cidade, associando culto e prostituição ritual. Historiadores antigos relatam a presença de centenas de prostitutas religiosas ligadas a esse culto. Diante desse cenário espiritualmente caótico, Paulo chega consciente da complexidade da missão que o aguardava, anunciando o Evangelho em fraqueza, e em temor e em grande tremor, conforme Primeira Coríntios, capítulo 2, versículos 1 a 5.'},
 {t:'subtopic', x:'2. Temor humano e dependência da graça.'},
 {t:'body', x:'O apóstolo traz consigo as marcas das perseguições sofridas em Filipos, Tessalônica e Bereia, conforme Atos, capítulo 16, versículos 22 a 24, e Atos, capítulo 17, versículos 5 a 10 e 13, além da constante preocupação pastoral com as igrejas já fundadas, conforme Segunda Coríntios, capítulo 11, versículo 28. A grandiosidade econômica de Corinto contrastava com sua profunda degradação espiritual, intensificando o peso emocional da missão. O próprio Paulo reconhece que esteve entre eles em fraqueza, e em temor e em grande tremor, conforme Primeira Coríntios, capítulo 2, versículo 3. Ainda assim, ele não recua. Sua experiência revela que o temor humano não anula a chamada divina, mas conduz o servo a uma dependência mais profunda da graça de Deus, que se aperfeiçoa na fraqueza, conforme Segunda Coríntios, capítulo 12, versículo 9.'},
 {t:'quote', x:'Apesar dos frutos visíveis, Paulo enfrenta forte oposição e passa a temer por sua permanência em Corinto.'},
 {t:'subtopic', x:'3. O início do ministério e a oposição na sinagoga.'},
 {t:'body', x:'Como era seu costume, Paulo inicia sua obra na sinagoga, anunciando que Jesus é o Cristo prometido. Nesse período, encontra Priscila e Áquila, judeus expulsos de Roma pelo decreto do imperador Cláudio. Trabalhando com eles como fabricante de tendas, Paulo une sustento próprio e missão, estabelecendo uma parceria que seria decisiva para a igreja em Corinto, conforme Atos, capítulo 18, versículos 2 e 3. Com a chegada de Silas e Timóteo, trazendo notícias animadoras e apoio das igrejas da Macedônia, Paulo passa a dedicar-se integralmente à Palavra, conforme Atos, capítulo 18, versículo 5. Contudo, a crescente oposição judaica o impede de continuar na sinagoga, preparando o caminho para uma nova etapa da missão, agora fora daquele ambiente religioso.'},

 {t:'label', x:'Ampliando o Conhecimento.'},
 {t:'aux', label:'O Papel de Corinto.', x:'Corinto desempenhou um papel significativo no ministério de Paulo, pois este a visitou em diversas ocasiões, conforme Primeira Coríntios, capítulo 12, versículo 14, e capítulo 13, versículo 1; escreveu Primeira e Segunda Coríntios para a sua igreja, e foi onde, ao que tudo indica, escreveu Romanos e Primeira e Segunda Tessalonicenses. Outros líderes da Igreja Primitiva também ministraram em Corinto, como Apolo, por exemplo, conforme Atos, capítulo 19, versículo 1. Amplie mais o seu conhecimento lendo o Dicionário Bíblico Baker, editado pela CPAD, páginas cento e vinte e seis e cento e vinte e sete.'},

 {t:'label', x:'Sinopse 1.'},
 {t:'body', x:'Paulo anuncia o Evangelho em Corinto, enfrentando oposição e dependendo da graça.'},

 {t:'aux', label:'Auxílio Bibliológico. Corinto.', x:'Corinto ostentava a acrópole mais impressionante da Grécia; a sua Acrocorinto elevava-se a duzentos e quarenta metros acima da cidade. A Acrocorinto servia de fortaleza e abrigava templos, sendo o mais famoso o templo de Afrodite, que, na cidade velha, destruída pelos romanos em cento e quarenta e seis antes de Cristo, ostentava mil escravos e prostitutas do templo. A sua presença contribuiu para a reputação de Corinto como cidade excessivamente imoral. Um verbo grego foi cunhado, korinthiazomai, literalmente corintiar, que significava praticar imoralidade sexual. Na época da chegada de Paulo, Corinto era um dos centros comerciais mais importantes de todo o Império Romano e a maior cidade da Grécia, com uma população livre de cerca de trezentos mil habitantes e mais quatrocentos e sessenta mil escravos. Corinto tinha uma população judaica significativa, sobretudo depois de quarenta e nove depois de Cristo, quando os judeus foram expulsos de Roma, conforme Atos, capítulo 18, versículo 2. Durante o ano e meio de ministério de Paulo, ele discutia regularmente na sinagoga, conforme Atos, capítulo 18, versículo 4. Dicionário Bíblico Baker. Rio de Janeiro, CPAD, dois mil e vinte e três, página cento e vinte e sete.'},

 {t:'topic', x:'Tópico 2. A Continuidade da Missão e o Encorajamento Divino. Atos, capítulo 18, versículos 7 a 11.'},
 {t:'subtopic', x:'1. A casa de Justo e o avanço do Evangelho.'},
 {t:'body', x:'Expulso da sinagoga, Paulo não abandona a cidade. Um gentio temente a Deus, Tito Justo, oferece sua casa, localizada ao lado da sinagoga, como novo espaço para a pregação. Essa mudança estratégica amplia o alcance do Evangelho e confere visibilidade positiva à nova comunidade cristã. O resultado é expressivo: muitos coríntios creem, entre eles Crispo, principal da sinagoga, que aceita a fé juntamente com toda a sua casa, conforme Atos, capítulo 18, versículos 7 e 8. O Evangelho demonstra, mais uma vez, que, quando portas se fecham, Deus abre novos caminhos para a expansão do Reino.'},
 {t:'quote', x:'Deus reafirma sua presença, promete proteção e revela que há muito povo naquela cidade.'},
 {t:'subtopic', x:'2. O medo do apóstolo e a palavra que fortalece.'},
 {t:'body', x:'Apesar dos frutos visíveis, Paulo enfrenta forte oposição e passa a temer por sua permanência em Corinto, conforme Primeira Coríntios, capítulo 2, versículo 3. O peso espiritual da cidade, aliado à hostilidade crescente, fragiliza emocionalmente o apóstolo. Nesse contexto, o Senhor lhe aparece em visão e o exorta: Não temas, mas fala e não te cales, conforme Atos, capítulo 18, versículo 9. Deus reafirma sua presença, promete proteção e revela que há muito povo naquela cidade. Essa palavra divina não apenas consola, mas reposiciona Paulo na missão, lembrando-o de que o sucesso da obra não depende da força humana, mas da fidelidade à chamada.'},
 {t:'subtopic', x:'3. Graça suficiente, perseverança e transição.'},
 {t:'body', x:'Fortalecido pela promessa do Senhor, Paulo permanece em Corinto por um ano e seis meses, ensinando a Palavra de Deus e consolidando a igreja, conforme Atos, capítulo 18, versículo 11. A experiência do apóstolo ensina que sentir medo não é sinal de fracasso espiritual, mas de oportunidade para experimentar a suficiência da graça divina. Quando o servo confia na presença de Deus, o temor é vencido e a missão prossegue. Contudo, a fidelidade de Paulo não o livraria de novos conflitos. A consolidação da igreja em Corinto logo despertaria reações mais intensas, culminando no julgamento do apóstolo diante do procônsul Gálio, episódio que revelará a soberania de Deus até mesmo nos tribunais humanos, conforme Atos, capítulo 18, versículos 12 a 17.'},

/* ============================================================
   RENDERIZAÇÃO
   ============================================================ */
const reader = document.getElementById('reader');
const segIndexEls = []; // elementos faláveis na ordem de leitura

function tokenize(el, text){
  // quebra por espaços preservando posição de caractere para casar com o boundary do TTS
  let i = 0;
  const re = /(\s+)/;
  const parts = text.split(re);
  let charPos = 0;
  for(const part of parts){
    if(part === '') continue;
    if(/^\s+$/.test(part)){
      el.appendChild(document.createTextNode(part));
      charPos += part.length;
    } else {
      const w = document.createElement('span');
      w.className = 'w';
      w.textContent = part;
      w.dataset.start = charPos;
      w.dataset.end = charPos + part.length;
      el.appendChild(w);
      charPos += part.length;
    }
  }
}

DATA.forEach(item=>{
  if(item.t === 'divider'){
    const d = document.createElement('div');
    d.className = 'sec-divider';
    d.innerHTML = '<span></span>';
    d.querySelector('span').textContent = item.x;
    reader.appendChild(d);
    return;
  }
  if(item.t === 'aux'){
    const box = document.createElement('div');
    box.className = 'aux';
    const lab = document.createElement('div');
    lab.className = 'label';
    box.appendChild(lab);
    // a label do auxílio também é falada
    const labSeg = document.createElement('div');
    labSeg.className = 'seg'; labSeg.tabIndex = 0;
    tokenize(labSeg, item.label);
    lab.appendChild(labSeg);
    segIndexEls.push(labSeg);

    const p = document.createElement('div');
    p.className = 'seg'; p.tabIndex = 0;
    p.style.fontStyle = 'italic';
    tokenize(p, item.x);
    box.appendChild(p);
    segIndexEls.push(p);
    reader.appendChild(box);
    return;
  }

  const el = document.createElement('div');
  el.className = 'seg ' + (
    item.t==='label'?'label':
    item.t==='topic'?'topic':
    item.t==='subtopic'?'subtopic':
    item.t==='versehead'?'versehead':
    item.t==='verse'?'verse':
    item.t==='daily'?'daily':'body'
  );
  if(item.t==='quote') el.className = 'seg quote';
  if(item.t==='body') el.classList.add('body');
  el.tabIndex = 0;
  tokenize(el, item.x);
  reader.appendChild(el);
  segIndexEls.push(el);
});

/* ============================================================
   SÍNTESE DE VOZ + DESTAQUE
   ============================================================ */
const synth = window.speechSynthesis;
let voices = [];
let current = 0;
let playing = false;
let stopped = true;

const $play = document.getElementById('play');
const $pause = document.getElementById('pause');
const $stop = document.getElementById('stop');
const $rate = document.getElementById('rate');
const $rateVal = document.getElementById('rateVal');
const $voice = document.getElementById('voice');
const $status = document.getElementById('status');

if(!synth){
  $status.textContent = 'Seu navegador não suporta leitura em voz alta. Tente o Chrome, Edge ou Safari.';
  $play.disabled = true;
}

function loadVoices(){
  voices = synth.getVoices();
  const pt = voices.filter(v => /pt/i.test(v.lang));
  const list = pt.length ? pt : voices;
  $voice.innerHTML = '';
  list.forEach(v=>{
    const o = document.createElement('option');
    o.value = v.name;
    o.textContent = v.name + (/pt.?br/i.test(v.lang) ? '  (Brasil)' : '  ['+v.lang+']');
    $voice.appendChild(o);
  });
  // preferir uma voz pt-BR
  const br = list.find(v=>/pt.?br/i.test(v.lang));
  if(br) $voice.value = br.name;
}
if(synth){
  loadVoices();
  synth.onvoiceschanged = loadVoices;
}

function chosenVoice(){
  return voices.find(v=>v.name === $voice.value) || voices.find(v=>/pt/i.test(v.lang)) || null;
}

function clearWordHL(el){
  if(!el) return;
  el.querySelectorAll('.w.spoken').forEach(w=>w.classList.remove('spoken'));
}
function clearAll(){
  segIndexEls.forEach(s=>{ s.classList.remove('active'); clearWordHL(s); });
}

function speakFrom(i){
  if(i >= segIndexEls.length){ finish(); return; }
  current = i;
  const el = segIndexEls[i];
  const text = el.textContent.trim();

  clearAll();
  el.classList.add('active');
  el.scrollIntoView({behavior:'smooth', block:'center'});

  const u = new SpeechSynthesisUtterance(text);
  const v = chosenVoice();
  if(v) u.voice = v;
  u.lang = (v && v.lang) || 'pt-BR';
  u.rate = parseFloat($rate.value);

  const words = Array.from(el.querySelectorAll('.w'));
  u.onboundary = (e)=>{
    if(e.charIndex == null) return;
    clearWordHL(el);
    // casa o índice do caractere com o intervalo da palavra
    let hit = null;
    for(const w of words){
      const s = +w.dataset.start, en = +w.dataset.end;
      if(e.charIndex >= s && e.charIndex < en){ hit = w; break; }
      if(e.charIndex < s){ hit = w; break; }
    }
    if(hit) hit.classList.add('spoken');
  };
  u.onend = ()=>{
    clearWordHL(el);
    if(stopped) return;
    speakFrom(i+1);
  };
  u.onerror = ()=>{ if(!stopped) speakFrom(i+1); };

  $status.textContent = 'Lendo… trecho ' + (i+1) + ' de ' + segIndexEls.length;
  synth.speak(u);
}

function start(fromIndex){
  if(!synth) return;
  stopped = false; playing = true;
  synth.cancel();
  $play.disabled = true; $pause.disabled = false; $stop.disabled = false;
  $pause.textContent = '⏸ Pausar';
  speakFrom(fromIndex != null ? fromIndex : current);
}
function finish(){
  playing = false; stopped = true;
  clearAll();
  $play.disabled = false; $pause.disabled = true; $stop.disabled = true;
  $play.textContent = '▶ Ouvir';
  $status.textContent = 'Leitura concluída.';
  current = 0;
}

$play.addEventListener('click', ()=>{
  if(synth.paused && playing){
    synth.resume(); $pause.disabled=false; $pause.textContent='⏸ Pausar';
    $status.textContent = 'Retomando…';
    return;
  }
  $play.textContent = '▶ Ouvir';
  start(current);
});
$pause.addEventListener('click', ()=>{
  if(synth.paused){
    synth.resume(); $pause.textContent='⏸ Pausar'; $status.textContent='Retomando…';
  } else {
    synth.pause(); $pause.textContent='▶ Continuar'; $status.textContent='Pausado.';
  }
});
$stop.addEventListener('click', ()=>{
  stopped = true; playing = false;
  synth.cancel();
  finish();
  $status.textContent = 'Parado.';
});
$rate.addEventListener('input', ()=>{
  $rateVal.textContent = parseFloat($rate.value).toFixed(2)+'×';
});

// clique em qualquer trecho começa a leitura a partir dele
segIndexEls.forEach((el, idx)=>{
  const go = ()=>{ start(idx); };
  el.addEventListener('click', go);
  el.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); }});
});

// segurança: cancelar fala ao fechar
window.addEventListener('beforeunload', ()=>{ try{ synth.cancel(); }catch(e){} });
</script>
