 {t:'label', x:'Lição 3.'},

 {t:'label', x:'Texto Áureo.'},
 {t:'quote', x:'"Porque pela graça sois salvos, por meio da fé; e isso não vem de vós; é dom de Deus." Efésios, capítulo 2, versículo 8.'},

 {t:'label', x:'Verdade Prática.'},
 {t:'body', x:'É pela graça que somos alcançados, perdoados e reconciliados com Deus.'},

 {t:'label', x:'Leitura Diária.'},
 {t:'daily', x:'Segunda. Atos, capítulo 15, versículo 11. A salvação é afirmada como obra exclusiva da graça do Senhor Jesus.'},
 {t:'daily', x:'Terça. Atos, capítulo 10, versículos 44 a 48. Deus não faz distinção entre pessoas.'},
 {t:'daily', x:'Quarta. Efésios, capítulo 2, versículos 8 e 9. A salvação é um dom gratuito de Deus.'},
 {t:'daily', x:'Quinta. Tito, capítulo 2, versículos 11 e 12. A graça de Deus se manifestou trazendo salvação a todos.'},
 {t:'daily', x:'Sexta. Hebreus, capítulo 4, versículo 16. O trono da graça está aberto para o crente.'},
 {t:'daily', x:'Sábado. Segunda Pedro, capítulo 3, versículo 18. Crescendo em graça e conhecimento de Jesus Cristo.'},

 {t:'label', x:'Leitura Bíblica em Classe.'},
 {t:'versehead', x:'Atos, capítulo 15, versículos 1 a 5, 28, 29, e 36 a 39.'},
 {t:'verse', x:'Versículo 1. Então, alguns que tinham descido da Judeia ensinavam assim os irmãos: Se vos não circuncidardes, conforme o uso de Moisés, não podeis salvar-vos.'},
 {t:'verse', x:'Versículo 2. Tendo tido Paulo e Barnabé não pequena discussão e contenda contra eles, resolveu-se que Paulo, Barnabé e alguns dentre eles subissem a Jerusalém aos apóstolos e aos anciãos sobre aquela questão.'},
 {t:'verse', x:'Versículo 3. E eles, sendo acompanhados pela igreja, passaram pela Fenícia e por Samaria, contando a conversão dos gentios, e davam grande alegria a todos os irmãos.'},
 {t:'verse', x:'Versículo 4. Quando chegaram a Jerusalém, foram recebidos pela igreja e pelos apóstolos e anciãos e lhes anunciaram quão grandes coisas Deus tinha feito com eles.'},
 {t:'verse', x:'Versículo 5. Alguns, porém, da seita dos fariseus que tinham crido se levantaram, dizendo que era mister circuncidá-los e mandar-lhes que guardassem a lei de Moisés.'},
 {t:'verse', x:'Versículo 28. Na verdade, pareceu bem ao Espírito Santo e a nós não vos impor mais encargo algum, senão estas coisas necessárias.'},
 {t:'verse', x:'Versículo 29. Que vos abstenhais das coisas sacrificadas aos ídolos, e do sangue, e da carne sufocada, e da fornicação; destas coisas fareis bem se vos guardardes. Bem vos vá.'},
 {t:'verse', x:'Versículo 36. Alguns dias depois, disse Paulo a Barnabé: Tornemos a visitar nossos irmãos por todas as cidades em que já anunciamos a palavra do Senhor, para ver como estão.'},
 {t:'verse', x:'Versículo 37. E Barnabé aconselhava que tomassem consigo a João, chamado Marcos.'},
 {t:'verse', x:'Versículo 38. Mas a Paulo parecia razoável que não tomassem consigo aquele que desde a Panfília se tinha apartado deles e não os acompanhou naquela obra.'},
 {t:'verse', x:'Versículo 39. E tal contenda houve entre eles, que se apartaram um do outro. Barnabé, levando consigo a Marcos, navegou para Chipre.'},
 {t:'body', x:'Hinos sugeridos: trezentos e noventa e quatro, quatrocentos e nove, e quatrocentos e trinta e três, da Harpa Cristã.'},

 {t:'divider', x:'Plano de Aula'},
 {t:'subtopic', x:'1. Introdução.'},
 {t:'body', x:'Esta lição nos convida a uma reflexão madura e bíblica sobre a graça de Deus como fundamento da salvação e da unidade da Igreja. A partir do Concílio de Jerusalém, o estudo evidencia que a fé cristã não se apoia em méritos humanos, mas na ação soberana de Deus em Cristo. Ao ensinar, valorize o diálogo, a experiência de vida dos alunos e a aplicação prática, ajudando-os a compreender, viver e crescer na graça que alcança todas as nações.'},

 {t:'subtopic', x:'2. Apresentação da Lição.'},
 {t:'body', x:'Objetivos da Lição. Primeiro, analisar com a classe como a graça sustenta a unidade da Igreja em Atos, capítulo 15. Segundo, examinar biblicamente a salvação pela graça como oferta universal em Cristo. Terceiro, incentivar a busca constante do trono da graça.'},
 {t:'body', x:'Motivação. A graça que alcança todas as nações é essencial porque revela o coração do Evangelho e preserva a fé de legalismos e distorções liberais. Ao compreender a salvação como dom divino, o aluno fortalece sua convicção bíblica, cresce em unidade cristã e aprende a viver a fé com humildade, gratidão e compromisso diário com Deus.'},
 {t:'body', x:'Sugestão de Método. Para reforçar a perspectiva bíblica do oferecimento universal da salvação, no segundo tópico, sugerimos que adote o método do contraste doutrinário guiado pelas Escrituras. Inicie apresentando textos centrais que afirmam a universalidade da graça, Romanos, capítulo 10, versículo 13; Tito, capítulo 2, versículo 11; e Primeira Timóteo, capítulo 2, versículos 3 a 6, e, em seguida, proponha a comparação respeitosa com correntes que restringem a salvação a um grupo previamente determinado. Estimule a classe a examinar o contexto bíblico, a coerência do caráter amoroso de Deus e a responsabilidade humana na resposta da fé. O objetivo é capacitar o aluno a defender, com mansidão e clareza, que a graça é suficiente e oferecida a todos.'},

 {t:'subtopic', x:'3. Conclusão da Lição.'},
 {t:'body', x:'Aplicação. À luz do ensino bíblico, o cristão é chamado a viver sob o governo da graça, rejeitando todo legalismo e toda indiferença espiritual. Quem foi alcançado pela graça de Deus responde com fé obediente, compromisso com a santidade e disposição para anunciar que a salvação em Cristo está disponível a todos.'},

 {t:'subtopic', x:'4. Subsídio ao Professor.'},
 {t:'body', x:'Revista Ensinador Cristão. Vale a pena conhecer essa revista que traz reportagens, artigos, entrevistas e subsídios de apoio à Lições Bíblicas Adultos. Na edição cento e seis, página trinta e sete, você encontrará um subsídio especial para esta lição.'},
 {t:'body', x:'Auxílios Especiais. Ao final do tópico, você encontrará auxílios que darão suporte na preparação de sua aula. Primeiro, o texto A Importância da Circuncisão, localizado depois do primeiro tópico, traz o contexto cultural da discussão de Atos, capítulo 15. Segundo, o texto A Graça que Respeita, localizado ao final do segundo tópico, aprofunda a reflexão da operação da Graça de Deus diante da cultura alheia.'},

 {t:'divider', x:'Comentário'},
 {t:'label', x:'Introdução.'},
 {t:'body', x:'A expansão do Evangelho entre os gentios trouxe grande alegria à Igreja, mas também revelou um dos primeiros desafios doutrinários do Cristianismo. Com o retorno de Paulo e Barnabé a Antioquia da Síria, após a evangelização da Ásia Menor, surgiu uma controvérsia que ameaçava a unidade da fé: a salvação estaria condicionada à observância da Lei de Moisés? Cristãos oriundos do farisaísmo passaram a exigir a circuncisão dos gentios convertidos, provocando um debate decisivo sobre a natureza da graça. Diante dessa crise, a Igreja buscou discernimento espiritual e fidelidade às Escrituras, culminando numa decisão importante, no Concílio de Jerusalém, que mostrou que a Graça de Deus alcança todas as nações.'},
 {t:'label', x:'Palavra-chave.'},
 {t:'body', x:'Graça.'},

 {t:'topic', x:'Tópico 1. Quando a Graça Preserva a Unidade da Igreja.'},
 {t:'subtopic', x:'1. O Concílio de Jerusalém.'},
 {t:'body', x:'Realizado entre quarenta e oito e cinquenta depois de Cristo, o Concílio reuniu apóstolos, presbíteros e a igreja para tratar da controvérsia levantada pelos judaizantes, que defendiam a circuncisão como requisito para a salvação, Atos, capítulo 15, versículos 1 e 5. Contudo, tal exigência contrariava o ensino bíblico, pois a circuncisão nunca foi meio de justificação, Romanos, capítulo 2, versículos 25 a 29. Sob a liderança de Tiago e a direção do Espírito Santo, a Igreja reconheceu que a salvação alcança todas as nações pela graça.'},
 {t:'subtopic', x:'2. O relatório de Pedro, versículos 7 a 11.'},
 {t:'body', x:'Pedro relembra de sua experiência na casa de Cornélio, mostrando que Deus concedeu o Espírito Santo aos gentios mediante a fé, e não por obras da Lei, Atos, capítulo 10, versículos 44 a 46; Gálatas, capítulo 3, versículo 2. Sem fazer distinção entre judeus e gentios, Deus purificou seus corações pela fé, Atos, capítulo 10, versículos 34 a 48. Assim, Pedro questiona a imposição do jugo da Lei e afirma que todos são salvos pela graça do Senhor Jesus Cristo, Atos, capítulo 15, versículo 11.'},
 {t:'subtopic', x:'3. O relatório de Paulo e Barnabé, versículo 12.'},
 {t:'body', x:'Em seguida, Paulo e Barnabé relatam como Deus confirmou a missão gentílica por meio de sinais e prodígios, Atos, capítulo 4, versículo 30. Milagres como a cegueira do mágico cipriota, a cura em Listra e o livramento de Paulo testemunham a aprovação divina, Atos, capítulo 13, versículos 8 a 11; capítulo 14, versículos 8 a 10; e capítulo 14, versículos 19 e 20. Além disso, destacam que os gentios foram salvos pela graça, sem a exigência da Lei, Atos, capítulo 13, versículos 12, 44 e 48.'},
 {t:'subtopic', x:'4. O discurso de Tiago, versículos 13 a 21.'},
 {t:'body', x:'Tiago, o Justo, irmão do Senhor e líder respeitado da igreja, preside o Concílio com discernimento espiritual, Gálatas, capítulo 2, versículo 9. Após ouvir os testemunhos, reconhece que Deus visitou os gentios para formar dentre eles um povo para o seu nome. Fundamenta sua proposta nas Escrituras, citando Amós, capítulo 9, versículos 11 e 12, mostrando que a inclusão dos gentios já fazia parte do plano redentor. Assim, afirma que a missão gentílica não contradiz a revelação, mas a cumpre. O Concílio decide não impor a Lei mosaica aos gentios, recomendando apenas a abstinência de práticas que comprometeriam a comunhão: idolatria, imoralidade sexual, carne sufocada e sangue. A decisão é comunicada por carta às igrejas gentílicas, enviada com Paulo, Barnabé, Judas e Silas, reafirmando a direção do Espírito Santo, Atos, capítulo 15, versículo 28, e trazendo consolo e unidade. Após isso, surge a divergência entre Paulo e Barnabé quanto a João Marcos, resultando na separação dos dois líderes. Ainda assim, a obra missionária prossegue, e Marcos é posteriormente restaurado, Colossenses, capítulo 4, versículo 10; e Segunda Timóteo, capítulo 4, versículo 11.'},
 {t:'body', x:'A decisão do Concílio revelou que a graça que preserva a unidade da Igreja é a mesma que Deus oferece como dom de salvação a todos, sem distinção.'},

 {t:'label', x:'Ampliando o Conhecimento.'},
 {t:'subtopic', x:'A Graça do Senhor Jesus.'},
 {t:'body', x:'A questão crucial no concílio de Jerusalém era se a circuncisão, isto é, a remoção do prepúcio como um sinal do Antigo Testamento da aceitação do concerto de Deus, e a obediência à lei que Deus deu através de Moisés eram necessárias para a salvação. Aqueles que receberam esta delegação concluíram que os gentios, isto é, aqueles que não eram judeus, estariam sendo espiritualmente salvos pela graça do Senhor Jesus. Amplie mais o seu conhecimento lendo a Bíblia de Estudo Pentecostal, Edição Global, editada pela CPAD, página mil novecentos e setenta e dois.'},

 {t:'label', x:'Sinopse 1.'},
 {t:'body', x:'O Concílio de Jerusalém confirma a graça como base da unidade cristã.'},

 {t:'aux', label:'Auxílio Bíblico-Exegético. A Importância da Circuncisão.', x:'A circuncisão era uma das práticas mais importantes do judaísmo, era central para a identidade judaica. Outras alianças tinham sinais diferentes, por exemplo, o arco no céu, Gênesis, capítulo 9, versículos 12, 13 e 17, mas a circuncisão colocava a marca da aliança na própria carne da pessoa, Gênesis, capítulo 17, versículos 11 e 13. A centralidade da circuncisão na vida judaica regular antes de Adriano pode ser exemplificada na reunião de convidados nas noites entre o nascimento de um menino e sua circuncisão no oitavo dia de vida. Uma obra pré-cristã opinava que a falha de alguns judeus, chamados filhos de Belial, em circuncidar seus filhos traria a ira sobre toda Israel por apostasia, conforme o livro de Jubileus, capítulo 15, versículos 33 e 34. O preço pago por Israel para manter a circuncisão poderia tornar o povo judeu muito mais leal a ela. Israel enfrentou o ridículo por causa dessa marca, razão pela qual alguns judeus tentavam apagá-la. Algumas mulheres tiveram de enfrentar a morte para circuncidar seus filhos; um opressor atirou-as do muro da cidade. Como a circuncisão era o sinal da aliança de Abraão, podia, pela justaposição com Êxodo, capítulo 4, versículos 22 e 23, e com os versículos 24 a 26, ser relacionada com a redenção. Por isso, mais tarde, os rabinos falavam do mérito envolvido na circuncisão. Keener, Craig S. Comentário Exegético Atos, capítulos 15 versículo 1 a 23 versículo 35. Rio de Janeiro, CPAD, dois mil e vinte e quatro, página dois mil seiscentos e vinte e três.'},

 {t:'quote', x:'Pedro questiona a imposição do jugo da Lei e afirma que todos são salvos pela graça do Senhor Jesus Cristo.'},

 {t:'topic', x:'Tópico 2. Um Presente de Salvação para Todos.'},
 {t:'subtopic', x:'1. O que é a graça de Deus?'},
 {t:'body', x:'A palavra grega cháris significa favor, bondade e dom imerecido. No Novo Testamento, a graça descreve a iniciativa soberana de Deus em salvar o ser humano, não por obras ou méritos, mas por amor e misericórdia, Efésios, capítulo 2, versículos 8 e 9. Diante do drama universal do pecado, que separou toda a humanidade de Deus, Romanos, capítulo 3, versículo 23, a graça se apresenta como o único meio de reconciliação. A Lei revela o pecado, mas não salva; somente a graça concede vida, pois onde abundou o pecado, superabundou a graça, Romanos, capítulo 5, versículo 20.'},
 {t:'subtopic', x:'2. Jesus Cristo como a manifestação da graça.'},
 {t:'body', x:'A graça alcança sua plena expressão na pessoa e na obra de Jesus Cristo. Por amor, Ele se fez pobre para nos enriquecer espiritualmente, Segunda Coríntios, capítulo 8, versículo 9. Em Cristo, a graça não apenas perdoa, mas justifica e transforma, conduzindo o crente a uma vida santa e piedosa, Romanos, capítulo 3, versículo 24; Tito, capítulo 2, versículos 11 e 12. Sua morte substitutiva e ressurreição garantem redenção, perdão e nova vida àqueles que creem, João, capítulo 1, versículo 17.'},

const reader = document.getElementById('reader');
const segIndexEls = [];

function tokenize(el, text){
  let i = 0;
  const re = /(\s+)/;
  const parts = text.split(re);
  let charPos = 0;
  for(const part of parts){
    if(part === '') continue;
    if(/^\s+$/.test(part)){
      el.appendChild(document.createTextNode(part));
      charPos += part.length;
    } else {
      const w = document.createElement('span');
      w.className = 'w';
      w.textContent = part;
      w.dataset.start = charPos;
      w.dataset.end = charPos + part.length;
      el.appendChild(w);
      charPos += part.length;
    }
  }
}

DATA.forEach(item=>{
  if(item.t === 'divider'){
    const d = document.createElement('div');
    d.className = 'sec-divider';
    d.innerHTML = '<span></span>';
    d.querySelector('span').textContent = item.x;
    reader.appendChild(d);
    return;
  }
  if(item.t === 'aux'){
    const box = document.createElement('div');
    box.className = 'aux';
    const lab = document.createElement('div');
    lab.className = 'label';
    box.appendChild(lab);
    const labSeg = document.createElement('div');
    labSeg.className = 'seg'; labSeg.tabIndex = 0;
    tokenize(labSeg, item.label);
    lab.appendChild(labSeg);
    segIndexEls.push(labSeg);

    const p = document.createElement('div');
    p.className = 'seg'; p.tabIndex = 0;
    p.style.fontStyle = 'italic';
    tokenize(p, item.x);
    box.appendChild(p);
    segIndexEls.push(p);
    reader.appendChild(box);
    return;
  }

  const el = document.createElement('div');
  el.className = 'seg ' + (
    item.t==='label'?'label':
    item.t==='topic'?'topic':
    item.t==='subtopic'?'subtopic':
    item.t==='versehead'?'versehead':
    item.t==='verse'?'verse':
    item.t==='daily'?'daily':'body'
  );
  if(item.t==='quote') el.className = 'seg quote';
  if(item.t==='body') el.classList.add('body');
  el.tabIndex = 0;
  tokenize(el, item.x);
  reader.appendChild(el);
  segIndexEls.push(el);
});

const synth = window.speechSynthesis;
let voices = [];
let current = 0;
let playing = false;
let stopped = true;

const $play = document.getElementById('play');
const $pause = document.getElementById('pause');
const $stop = document.getElementById('stop');
const $rate = document.getElementById('rate');
const $rateVal = document.getElementById('rateVal');
const $voice = document.getElementById('voice');
const $status = document.getElementById('status');

if(!synth){
  $status.textContent = 'Seu navegador não suporta leitura em voz alta. Tente o Chrome, Edge ou Safari.';
  $play.disabled = true;
}

function loadVoices(){
  voices = synth.getVoices();
  const pt = voices.filter(v => /pt/i.test(v.lang));
  const list = pt.length ? pt : voices;
  $voice.innerHTML = '';
  list.forEach(v=>{
    const o = document.createElement('option');
    o.value = v.name;
    o.textContent = v.name + (/pt.?br/i.test(v.lang) ? '  (Brasil)' : '  ['+v.lang+']');
    $voice.appendChild(o);
  });
  const br = list.find(v=>/pt.?br/i.test(v.lang));
  if(br) $voice.value = br.name;
}
if(synth){
  loadVoices();
  synth.onvoiceschanged = loadVoices;
}

function chosenVoice(){
  return voices.find(v=>v.name === $voice.value) || voices.find(v=>/pt/i.test(v.lang)) || null;
}

function clearWordHL(el){
  if(!el) return;
  el.querySelectorAll('.w.spoken').forEach(w=>w.classList.remove('spoken'));
}
function clearAll(){
  segIndexEls.forEach(s=>{ s.classList.remove('active'); clearWordHL(s); });
}

function speakFrom(i){
  if(i >= segIndexEls.length){ finish(); return; }
  current = i;
  const el = segIndexEls[i];
  const text = el.textContent.trim();

  clearAll();
  el.classList.add('active');
  el.scrollIntoView({behavior:'smooth', block:'center'});

  const u = new SpeechSynthesisUtterance(text);
  const v = chosenVoice();
  if(v) u.voice = v;
  u.lang = (v && v.lang) || 'pt-BR';
  u.rate = parseFloat($rate.value);

  const words = Array.from(el.querySelectorAll('.w'));
  u.onboundary = (e)=>{
    if(e.charIndex == null) return;
    clearWordHL(el);
    let hit = null;
    for(const w of words){
      const s = +w.dataset.start, en = +w.dataset.end;
      if(e.charIndex >= s && e.charIndex < en){ hit = w; break; }
      if(e.charIndex < s){ hit = w; break; }
    }
    if(hit) hit.classList.add('spoken');
  };
  u.onend = ()=>{
    clearWordHL(el);
    if(stopped) return;
    speakFrom(i+1);
  };
  u.onerror = ()=>{ if(!stopped) speakFrom(i+1); };

  $status.textContent = 'Lendo… trecho ' + (i+1) + ' de ' + segIndexEls.length;
  synth.speak(u);
}

function start(fromIndex){
  if(!synth) return;
  stopped = false; playing = true;
  synth.cancel();
  $play.disabled = true; $pause.disabled = false; $stop.disabled = false;
  $pause.textContent = '⏸ Pausar';
  speakFrom(fromIndex != null ? fromIndex : current);
}
function finish(){
  playing = false; stopped = true;
  clearAll();
  $play.disabled = false; $pause.disabled = true; $stop.disabled = true;
  $play.textContent = '▶ Ouvir';
  $status.textContent = 'Leitura concluída.';
  current = 0;
}

$play.addEventListener('click', ()=>{
  if(synth.paused && playing){
    synth.resume(); $pause.disabled=false; $pause.textContent='⏸ Pausar';
    $status.textContent = 'Retomando…';
    return;
  }
  $play.textContent = '▶ Ouvir';
  start(current);
});
$pause.addEventListener('click', ()=>{
  if(synth.paused){
    synth.resume(); $pause.textContent='⏸ Pausar'; $status.textContent='Retomando…';
  } else {
    synth.pause(); $pause.textContent='▶ Continuar'; $status.textContent='Pausado.';
  }
});
$stop.addEventListener('click', ()=>{
  stopped = true; playing = false;
  synth.cancel();
  finish();
  $status.textContent = 'Parado.';
});
$rate.addEventListener('input', ()=>{
  $rateVal.textContent = parseFloat($rate.value).toFixed(2)+'×';
});

segIndexEls.forEach((el, idx)=>{
  const go = ()=>{ start(idx); };
  el.addEventListener('click', go);
  el.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); }});
});

window.addEventListener('beforeunload', ()=>{ try{ synth.cancel(); }catch(e){} });
</script>
