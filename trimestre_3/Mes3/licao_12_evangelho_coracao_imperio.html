<style>
  :root{
    --bg:#f4ecd8;

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 18% 12%, #fbf3df 0%, transparent 55%),

  /* ---------- Top bar / controls ---------- */

  select,input[type=range]{accent-color:var(--gold);font-family:inherit;}

  h1.title{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(30px,6.4vw,50px);line-height:1.08;margin:14px 0 6px;color:var(--ink);}
  .rule{width:70px;height:2px;background:var(--gold);margin:18px auto;border:none;position:relative;}
  .rule::before,.rule::after{content:"";position:absolute;top:50%;width:5px;height:5px;background:var(--gold);border-radius:50%;transform:translateY(-50%);}

  /* ---------- Reading blocks ---------- */
  .seg{cursor:pointer;border-radius:8px;padding:3px 8px;margin:0 -8px;transition:background .15s ease;outline:none;}

  .label{font-family:'Cormorant Garamond',serif;text-transform:uppercase;letter-spacing:.26em;font-size:14px;font-weight:700;color:var(--gold-deep);margin:30px 0 4px;}
  .topic{font-family:'Cormorant Garamond',serif;font-size:clamp(23px,4.5vw,30px);font-weight:700;color:var(--ink);margin:38px 0 6px;line-height:1.15;}

  .daily{font-size:17px;margin:7px 0;}

  .hint{text-align:center;font-style:italic;color:var(--ink-soft);font-size:14px;margin:6px 0 26px;}
  .sec-divider{display:flex;align-items:center;gap:14px;margin:42px 0 8px;color:var(--gold);}
  .sec-divider::before,.sec-divider::after{content:"";flex:1;height:1px;background:var(--line);}
  .sec-divider span{font-family:'Cormorant Garamond',serif;letter-spacing:.3em;text-transform:uppercase;font-size:13px;font-weight:700;color:var(--gold-deep);}

    .status{width:100%;margin-left:0;text-align:left;}

<script>
/* ============================================================
   CONTEÚDO — texto otimizado para áudio
   Referências por extenso · pausas após títulos · sem caracteres estranhos
   ============================================================ */
const DATA = [
 {t:'label', x:'Lição 12.'},
 {t:'versehead', x:'O Evangelho Chega ao Coração do Império.'},
 {t:'body', x:'Vinte de Setembro de dois mil e vinte e seis. Dia Nacional da Escola Dominical.'},

 {t:'label', x:'Texto Áureo.'},
 {t:'quote', x:'"Pregando o Reino de Deus e ensinando com toda a liberdade as coisas pertencentes ao Senhor Jesus Cristo, sem impedimento algum." Atos, capítulo 28, versículo 31.'},

 {t:'label', x:'Verdade Prática.'},
 {t:'body', x:'Nada pode impedir o avanço do Reino de Deus quando o Evangelho é anunciado com fidelidade, coragem e esperança.'},

 {t:'label', x:'Leitura Diária.'},
 {t:'daily', x:'Segunda. Atos, capítulo 28, versículos 30 e 31. O Reino de Deus é anunciado com ousadia e liberdade.'},
 {t:'daily', x:'Terça. Mateus, capítulo 24, versículo 14. O Evangelho do Reino será pregado a todos os povos.'},
 {t:'daily', x:'Quarta. Filipenses, capítulo 1, versículos 12 a 14. As prisões servem ao progresso do Evangelho.'},
 {t:'daily', x:'Quinta. Segunda Timóteo, capítulo 2, versículos 8 e 9. O mensageiro pode estar preso, mas a Palavra não.'},
 {t:'daily', x:'Sexta. Atos, capítulo 4, versículos 29 a 31. O Espírito concede ousadia para anunciar Cristo.'},
 {t:'daily', x:'Sábado. Romanos, capítulo 8, versículo 31. Se Deus é por nós, ninguém pode nos impedir.'},

 {t:'label', x:'Leitura Bíblica em Classe.'},
 {t:'versehead', x:'Atos, capítulo 28, versículos 16 a 24, e 28 a 31.'},
 {t:'verse', x:'Versículo 16. E, logo que chegamos a Roma, o centurião entregou os presos ao general dos exércitos; mas a Paulo se lhe permitiu morar por sua conta, com o soldado que o guardava.'},
 {t:'verse', x:'Versículo 17. E aconteceu que, três dias depois, Paulo convocou os principais dos judeus e, juntos eles, lhes disse: Varões irmãos, não havendo eu feito nada contra o povo ou contra os ritos paternos, vim, contudo, preso desde Jerusalém, entregue nas mãos dos romanos,'},
 {t:'verse', x:'Versículo 18. os quais, havendo-me examinado, queriam soltar-me, por não haver em mim crime algum de morte.'},
 {t:'verse', x:'Versículo 19. Mas, opondo-se os judeus, foi-me forçoso apelar para César, não tendo, contudo, de que acusar a minha nação.'},
 {t:'verse', x:'Versículo 20. Por esta causa vos chamei, para vos ver e falar; porque pela esperança de Israel estou com esta cadeia.'},
 {t:'verse', x:'Versículo 21. Então, eles lhe disseram: Nós não recebemos acerca de ti cartas algumas da Judeia, nem veio aqui algum dos irmãos que nos anunciasse ou dissesse de ti mal algum.'},
 {t:'verse', x:'Versículo 22. No entanto, bem quiséramos ouvir de ti o que sentes; porque, quanto a esta seita, notório nos é que em toda parte se fala contra ela.'},
 {t:'verse', x:'Versículo 23. E, havendo-lhe eles assinalado um dia, muitos foram ter com ele à pousada, aos quais declarava com bom testemunho o Reino de Deus e procurava persuadi-los à fé de Jesus, tanto pela lei de Moisés como pelos profetas, desde pela manhã até à tarde.'},
 {t:'verse', x:'Versículo 24. E alguns criam no que se dizia, mas outros não criam.'},
 {t:'verse', x:'Versículo 28. Seja-vos, pois, notório que esta salvação de Deus é enviada aos gentios, e eles a ouvirão.'},
 {t:'verse', x:'Versículo 29. E, havendo ele dito isto, partiram os judeus, tendo entre si grande contenda.'},
 {t:'verse', x:'Versículo 30. E Paulo ficou dois anos inteiros na sua própria habitação que alugara e recebia todos quantos vinham vê-lo,'},
 {t:'verse', x:'Versículo 31. pregando o Reino de Deus e ensinando com toda a liberdade as coisas pertencentes ao Senhor Jesus Cristo, sem impedimento algum.'},
 {t:'body', x:'Hinos sugeridos: dezoito, cento e noventa e dois, e duzentos e noventa e oito, da Harpa Cristã.'},

 {t:'divider', x:'Plano de Aula'},
 {t:'subtopic', x:'1. Introdução.'},
 {t:'body', x:'Na lição desta semana, contemplamos um prisioneiro que, acorrentado, anuncia o Reino com liberdade. Roma representa o coração do poder humano; contudo, ali também ecoa a soberania de Cristo. Essa lição nos convida a perceber que correntes não aprisionam a Palavra. Quando o Evangelho é proclamado com fidelidade, Deus transforma limites em oportunidades e faz avançar sua missão.'},

 {t:'subtopic', x:'2. Apresentação da Lição.'},
 {t:'body', x:'Objetivos da Lição. Primeiro, mostrar que a prisão não impediu o avanço do Reino de Deus. Segundo, destacar a reação dos judeus e discernir o campo da decisão. Terceiro, enfatizar o exemplo de Paulo à missão da Igreja hoje.'},
 {t:'body', x:'Motivação. O livro de Atos termina sem ponto final porque a missão continua. Ao estudar o avanço do Evangelho aos gentios, perceberemos que fazemos parte dessa história. Somos herdeiros de uma obra que não pode ser detida. Compreender isso desperta responsabilidade, zelo e compromisso missionário.'},
 {t:'body', x:'Sugestão de Método. Inicie o terceiro tópico com a leitura dialogada do texto de Atos, capítulo 28, versículos 28 a 31, solicitando que a classe identifique expressões que revelem continuidade da missão, como enviada aos gentios, e sem impedimento algum. Em seguida, exponha o terceiro tópico e, depois, discuta com a classe como a rejeição parcial impulsionou a expansão do Evangelho. Peça para que dois ou três alunos relacionem o texto à realidade atual, no contexto social, profissional e familiar. Finalize com síntese coletiva, destacando que os membros do Corpo de Cristo são responsáveis por dar continuidade ao Reino em seu tempo.'},

 {t:'subtopic', x:'3. Conclusão da Lição.'},
 {t:'body', x:'Aplicação. Em Atos, assim como o apóstolo Paulo transformou limitações em oportunidade missionária, somos chamados a viver o Evangelho onde estamos. Mesmo diante de rejeições ou barreiras, a missão continua. Cada espaço, família, trabalho e igreja, pode tornar-se campo de proclamação do Reino, com ousadia e fidelidade.'},

 {t:'subtopic', x:'4. Subsídio ao Professor.'},
 {t:'body', x:'Revista Ensinador Cristão. Vale a pena conhecer essa revista que traz reportagens, artigos, entrevistas e subsídios de apoio à Lições Bíblicas Adultos. Na edição cento e seis, página quarenta e dois, você encontrará um subsídio especial para esta lição.'},
 {t:'body', x:'Auxílios Especiais. Ao final do tópico, você encontrará auxílios que darão suporte na preparação de sua aula. Primeiro, o texto Isaías e a Rejeição de Cristo em Roma, localizado depois do segundo tópico, aprofunda o episódio da pregação do Evangelho aos judeus de Roma. Segundo, o texto Atos Continua: A Missão não Terminou, localizado ao final do terceiro tópico, aprofunda o assunto a respeito da salvação dos gentios e a história inacabada da Igreja a partir de Atos.'},

 {t:'divider', x:'Comentário'},
 {t:'label', x:'Introdução.'},
 {t:'body', x:'Esta lição revela o ponto culminante da jornada missionária de Paulo: sua chegada a Roma, não como homem livre, mas como prisioneiro de Cristo. Mesmo sob custódia, o apóstolo transforma a residência vigiada em um centro de proclamação do Evangelho. O Livro de Atos se encerra mostrando que nada pode deter o avanço da Palavra. Com ousadia e fé inabalável, Paulo anuncia o Reino de Deus e o Senhor Jesus Cristo, revelando que o Evangelho segue adiante, sem impedimentos.'},
 {t:'label', x:'Palavra-chave.'},
 {t:'body', x:'Evangelho.'},

 {t:'topic', x:'Tópico 1. Paulo em Roma: Prisioneiro, mas Livre em Cristo.'},
 {t:'subtopic', x:'1. Mesmo em custódia, Paulo recebe certa liberdade.'},
 {t:'body', x:'Versículos 16, 20 e 30. Ao chegar a Roma, Paulo não foi lançado em uma prisão comum, mas colocado em residência vigiada, permanecendo sob custódia de um soldado. Ainda acorrentado, versículo 20, desfrutava de relativa liberdade para receber pessoas e testemunhar. Ele próprio custeava sua moradia, versículo 30, possivelmente com ajuda de irmãos na fé, Filipenses, capítulo 4, versículos 10, 14 e 18. Essa condição revela que, embora limitado fisicamente, Paulo não estava aprisionado espiritualmente. Suas correntes não restringiram sua comunhão nem sua missão. Assim, aprendemos que a verdadeira liberdade não depende de circunstâncias externas, mas da comunhão com Cristo, Segunda Coríntios, capítulo 3, versículo 17.'},
 {t:'subtopic', x:'2. A prisão não impede o cumprimento do plano de Deus.'},
 {t:'body', x:'Paulo compreendeu que sua prisão fazia parte do propósito divino. Em vez de desânimo, enxergou oportunidade: soldados, oficiais e visitantes passaram a ouvir o Evangelho. O que parecia derrota tornou-se avanço missionário, Filipenses, capítulo 1, versículo 12. Essa postura revela maturidade espiritual: confiar que Deus age mesmo nas adversidades, Romanos, capítulo 8, versículo 28. O cristão é chamado a discernir o agir de Deus nos momentos difíceis e a glorificá-lo em toda circunstância, transformando provações em testemunho vivo da graça.'},
 {t:'subtopic', x:'3. O Evangelho vence barreiras políticas, sociais e religiosas.'},
 {t:'body', x:'A vida de Paulo comprova que nenhuma estrutura humana pode deter a Palavra. Diante de governadores e reis, proclamou a fé com ousadia, Atos, capítulo 24, versículos 24 e 25; e Atos, capítulo 26, versículos 1 a 32, demonstrando que Deus governa sobre todos os reinos, Daniel, capítulo 4, versículo 32. Socialmente, anunciou um Evangelho que reconcilia ricos e pobres, livres e escravos, Filemom, versículos 10 a 16; e Gálatas, capítulo 3, versículo 28. Religiosamente, enfrentou tanto a incredulidade judaica quanto a idolatria gentílica, mantendo firme a centralidade de Cristo, Atos, capítulo 13, versículos 45 e 46; e Atos, capítulo 19, versículos 26 e 27. Logo, a Igreja de hoje é chamada a viver esse mesmo Evangelho que rompe muros e reconcilia vidas. Com o propósito de imitá-lo, veremos como Paulo utiliza sua liberdade limitada para anunciar o Reino de Deus sem impedimento algum.'},

 {t:'label', x:'Sinopse 1.'},
 {t:'body', x:'Preso em Roma, Paulo permaneceu livre para cumprir sua missão.'},

 {t:'quote', x:'"O texto revela que o Evangelho avança apesar da resistência humana e que o plano de Deus inclui todas as nações."'},

 {t:'topic', x:'Tópico 2. O Evangelho Pregado aos Judeus em Roma.'},
 {t:'subtopic', x:'1. Paulo convoca os líderes judeus para esclarecer sua situação.'},
 {t:'body', x:'Versículo 17. Três dias após chegar a Roma, Paulo reúne os principais líderes judeus para explicar as razões de sua prisão. Embora os judeus tivessem sido expulsos da cidade por decreto de Cláudio, Atos, capítulo 18, versículo 2, muitos já haviam retornado, e havia expressiva presença judaica em Roma. O apóstolo deixa claro que não cometeu nenhuma ofensa contra o povo judeu nem contra as tradições dos pais. Mesmo assim, foi entregue aos romanos em Jerusalém. Após ser interrogado, poderia ter sido libertado, mas a oposição judaica o levou a apelar para César, versículos 18 e 19. Sua atitude revela amor pelo próprio povo e compromisso com a verdade. Ao afirmar estar preso pela esperança de Israel, versículo 20, Paulo aponta para a esperança messiânica e a ressurreição, Atos, capítulo 23, versículo 6; e Atos, capítulo 26, versículos 6 a 8, despertando o interesse dos judeus em ouvir sua posição acerca do Caminho, do qual se falava por toda parte, versículo 22.'},
 {t:'subtopic', x:'2. Paulo anuncia o Reino de Deus, mostrando Cristo nas Escrituras.'},
 {t:'body', x:'Versículos 23 e 24. Em dia marcado, Paulo passa longas horas expondo o Reino de Deus e procurando persuadi-los acerca de Jesus, fundamentando-se na Lei de Moisés e nos Profetas, versículo 23. Sua pregação é bíblica, paciente e centrada em Cristo. O resultado é misto: alguns creem, outros rejeitam, versículo 24. Diante da incredulidade, Paulo aplica Isaías, capítulo 6, versículos 9 e 10, denunciando a dureza do coração e anunciando que a salvação seria enviada aos gentios, que a ouviriam, versículos 26 e 27. O texto revela que o Evangelho avança apesar da resistência humana e que o plano de Deus inclui todas as nações.'},
 {t:'subtopic', x:'3. A reação dividida revela que o coração é o campo da decisão.'},
 {t:'body', x:'A Palavra foi anunciada com clareza, mas as respostas foram distintas. Isso evidencia que o coração humano é o campo onde a decisão acontece. A Escritura sempre exige resposta: fé ou rejeição, Deuteronômio, capítulo 11, versículos 26 a 28; Salmos, capítulo 119, versículo 11; e Provérbios, capítulo 4, versículo 23. Nesse caso, ouvir a Palavra não é suficiente; é necessário obedecer e acolher Cristo pela fé, Lucas, capítulo 11, versículo 28. A partir dessa rejeição parcial, o texto mostrará como Paulo passa a dedicar-se livremente à proclamação do Evangelho a todos, sem distinção, anunciando o Reino de Deus com ousadia e perseverança.'},

 {t:'label', x:'Sinopse 2.'},
 {t:'body', x:'Paulo anuncia Cristo aos judeus; alguns creem, outros rejeitam.'},

 {t:'aux', label:'Auxílio Bibliológico. Isaías e a Rejeição de Cristo em Roma.', x:'Os judeus em Roma tinham ouvido a respeito da seita do cristianismo, do ponto de vista dos judeus, capítulo 24, versículo 14, mas não tinham recebido nenhuma palavra oficial de Jerusalém sobre Paulo. Essa falta de comunicação entre Jerusalém e Roma pode ter sido causada pelo inverno ou pode indicar que os líderes judeus em Jerusalém tinham perdido o interesse no caso de Paulo, uma vez que ele agora estava fora da vista deles, além de sua jurisdição e, provavelmente, não mais lhes causaria problemas. De qualquer forma, os cristãos de Jerusalém sabiam mais da situação de Paulo do que os judeus incrédulos. Lucas identifica o momento decisivo na discussão como sendo a palavra desafiadora de Paulo de que o Espírito Santo bem falou por meio do profeta Isaías sobre a obstinação espiritual de Israel. Uma vez que Paulo disse isso em resposta àqueles que não criam, versículo 24, naquilo que ele dizia sobre Jesus, sua citação de Isaías sugeria claramente que a vinda de Jesus Cristo e sua rejeição pelos judeus foram preditas no Antigo Testamento. Bíblia de Estudo Holman. Rio de Janeiro: CPAD, dois mil e dezenove, página mil setecentos e setenta e seis.'},

 {t:'topic', x:'Tópico 3. A Rejeição dos Judeus e a Salvação aos Gentios.'},
 {t:'subtopic', x:'1. O endurecimento espiritual de Israel.'},
 {t:'body', x:'Diante da reação dividida dos judeus em Roma, Paulo encerra o diálogo citando Isaías, capítulo 6, versículos 9 e 10, revelando que a rejeição não era falta de evidência, mas resistência do coração, Mateus, capítulo 13, versículos 14 e 15; e Romanos, capítulo 11, versículo 7. A Palavra havia sido anunciada com clareza, porém muitos escolheram não obedecer. A cegueira denunciada pelo profeta não era intelectual, mas espiritual, Marcos, capítulo 4, versículo 12; e Lucas, capítulo 8, versículo 10. A rejeição da verdade endurece o coração e afasta o homem da salvação. Por isso, toda geração é chamada a responder à Palavra com fé e submissão. Rejeitar o chamado de Deus é assumir o risco do endurecimento espiritual, João, capítulo 14, versículo 21.'},

/* ============================================================
   RENDERIZAÇÃO
   ============================================================ */
const reader = document.getElementById('reader');
const segIndexEls = []; // elementos faláveis na ordem de leitura

function tokenize(el, text){
  // quebra por espaços preservando posição de caractere para casar com o boundary do TTS
  let i = 0;
  const re = /(\s+)/;
  const parts = text.split(re);
  let charPos = 0;
  for(const part of parts){
    if(part === '') continue;
    if(/^\s+$/.test(part)){
      el.appendChild(document.createTextNode(part));
      charPos += part.length;
    } else {
      const w = document.createElement('span');
      w.className = 'w';
      w.textContent = part;
      w.dataset.start = charPos;
      w.dataset.end = charPos + part.length;
      el.appendChild(w);
      charPos += part.length;
    }
  }
}

DATA.forEach(item=>{
  if(item.t === 'divider'){
    const d = document.createElement('div');
    d.className = 'sec-divider';
    d.innerHTML = '<span></span>';
    d.querySelector('span').textContent = item.x;
    reader.appendChild(d);
    return;
  }
  if(item.t === 'aux'){
    const box = document.createElement('div');
    box.className = 'aux';
    const lab = document.createElement('div');
    lab.className = 'label';
    box.appendChild(lab);
    // a label do auxílio também é falada
    const labSeg = document.createElement('div');
    labSeg.className = 'seg'; labSeg.tabIndex = 0;
    tokenize(labSeg, item.label);
    lab.appendChild(labSeg);
    segIndexEls.push(labSeg);

    const p = document.createElement('div');
    p.className = 'seg'; p.tabIndex = 0;
    p.style.fontStyle = 'italic';
    tokenize(p, item.x);
    box.appendChild(p);
    segIndexEls.push(p);
    reader.appendChild(box);
    return;
  }

  const el = document.createElement('div');
  el.className = 'seg ' + (
    item.t==='label'?'label':
    item.t==='topic'?'topic':
    item.t==='subtopic'?'subtopic':
    item.t==='versehead'?'versehead':
    item.t==='verse'?'verse':
    item.t==='daily'?'daily':'body'
  );
  if(item.t==='quote') el.className = 'seg quote';
  if(item.t==='body') el.classList.add('body');
  el.tabIndex = 0;
  tokenize(el, item.x);
  reader.appendChild(el);
  segIndexEls.push(el);
});

/* ============================================================
   SÍNTESE DE VOZ + DESTAQUE
   ============================================================ */
const synth = window.speechSynthesis;
let voices = [];
let current = 0;
let playing = false;
let stopped = true;

const $play = document.getElementById('play');
const $pause = document.getElementById('pause');
const $stop = document.getElementById('stop');
const $rate = document.getElementById('rate');
const $rateVal = document.getElementById('rateVal');
const $voice = document.getElementById('voice');
const $status = document.getElementById('status');

if(!synth){
  $status.textContent = 'Seu navegador não suporta leitura em voz alta. Tente o Chrome, Edge ou Safari.';
  $play.disabled = true;
}

function loadVoices(){
  voices = synth.getVoices();
  const pt = voices.filter(v => /pt/i.test(v.lang));
  const list = pt.length ? pt : voices;
  $voice.innerHTML = '';
  list.forEach(v=>{
    const o = document.createElement('option');
    o.value = v.name;
    o.textContent = v.name + (/pt.?br/i.test(v.lang) ? '  (Brasil)' : '  ['+v.lang+']');
    $voice.appendChild(o);
  });
  // preferir uma voz pt-BR
  const br = list.find(v=>/pt.?br/i.test(v.lang));
  if(br) $voice.value = br.name;
}
if(synth){
  loadVoices();
  synth.onvoiceschanged = loadVoices;
}

function chosenVoice(){
  return voices.find(v=>v.name === $voice.value) || voices.find(v=>/pt/i.test(v.lang)) || null;
}

function clearWordHL(el){
  if(!el) return;
  el.querySelectorAll('.w.spoken').forEach(w=>w.classList.remove('spoken'));
}
function clearAll(){
  segIndexEls.forEach(s=>{ s.classList.remove('active'); clearWordHL(s); });
}

function speakFrom(i){
  if(i >= segIndexEls.length){ finish(); return; }
  current = i;
  const el = segIndexEls[i];
  const text = el.textContent.trim();

  clearAll();
  el.classList.add('active');
  el.scrollIntoView({behavior:'smooth', block:'center'});

  const u = new SpeechSynthesisUtterance(text);
  const v = chosenVoice();
  if(v) u.voice = v;
  u.lang = (v && v.lang) || 'pt-BR';
  u.rate = parseFloat($rate.value);

  const words = Array.from(el.querySelectorAll('.w'));
  u.onboundary = (e)=>{
    if(e.charIndex == null) return;
    clearWordHL(el);
    // casa o índice do caractere com o intervalo da palavra
    let hit = null;
    for(const w of words){
      const s = +w.dataset.start, en = +w.dataset.end;
      if(e.charIndex >= s && e.charIndex < en){ hit = w; break; }
      if(e.charIndex < s){ hit = w; break; }
    }
    if(hit) hit.classList.add('spoken');
  };
  u.onend = ()=>{
    clearWordHL(el);
    if(stopped) return;
    speakFrom(i+1);
  };
  u.onerror = ()=>{ if(!stopped) speakFrom(i+1); };

  $status.textContent = 'Lendo… trecho ' + (i+1) + ' de ' + segIndexEls.length;
  synth.speak(u);
}

function start(fromIndex){
  if(!synth) return;
  stopped = false; playing = true;
  synth.cancel();
  $play.disabled = true; $pause.disabled = false; $stop.disabled = false;
  $pause.textContent = '⏸ Pausar';
  speakFrom(fromIndex != null ? fromIndex : current);
}
function finish(){
  playing = false; stopped = true;
  clearAll();
  $play.disabled = false; $pause.disabled = true; $stop.disabled = true;
  $play.textContent = '▶ Ouvir';
  $status.textContent = 'Leitura concluída.';
  current = 0;
}

$play.addEventListener('click', ()=>{
  if(synth.paused && playing){
    synth.resume(); $pause.disabled=false; $pause.textContent='⏸ Pausar';
    $status.textContent = 'Retomando…';
    return;
  }
  $play.textContent = '▶ Ouvir';
  start(current);
});
$pause.addEventListener('click', ()=>{
  if(synth.paused){
    synth.resume(); $pause.textContent='⏸ Pausar'; $status.textContent='Retomando…';
  } else {
    synth.pause(); $pause.textContent='▶ Continuar'; $status.textContent='Pausado.';
  }
});
$stop.addEventListener('click', ()=>{
  stopped = true; playing = false;
  synth.cancel();
  finish();
  $status.textContent = 'Parado.';
});
$rate.addEventListener('input', ()=>{
  $rateVal.textContent = parseFloat($rate.value).toFixed(2)+'×';
});

// clique em qualquer trecho começa a leitura a partir dele
segIndexEls.forEach((el, idx)=>{
  const go = ()=>{ start(idx); };
  el.addEventListener('click', go);
  el.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); }});
});

// segurança: cancelar fala ao fechar
window.addEventListener('beforeunload', ()=>{ try{ synth.cancel(); }catch(e){} });
</script>
