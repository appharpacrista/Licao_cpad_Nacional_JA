<script>
const DATA=[
{t:'label',x:'Lição 3.'},
{t:'versehead',x:'A Fidelidade de Deus diante da Infidelidade de Israel.'},
{t:'body',x:'Dezoito de outubro de dois mil e vinte e seis.'},
{t:'label',x:'Texto Áureo.'},
{t:'quote',x:'Pelo que hoje saberás e refletirás no teu coração que só o SENHOR é Deus em cima no céu e embaixo na terra; nenhum outro há. Deuteronômio, capítulo 4, versículo 39.'},
{t:'label',x:'Verdade Prática.'},
{t:'body',x:'Reconhecer que só o Senhor é Deus exige fidelidade, obediência à sua Palavra e rejeição da idolatria.'},
{t:'label',x:'Leitura Diária.'},
{t:'daily',x:'Segunda. Deuteronômio, capítulo 4, versículos 1 e 2; e Deuteronômio, capítulo 7, versículos 1 a 9. A obediência à Palavra é condição para viver na aliança.'},
{t:'daily',x:'Terça. Deuteronômio, capítulo 4, versículos 3 e 4; e Números, capítulo 25, versículos 3 a 5. A disciplina divina revela a justiça de Deus e preserva os fiéis.'},
{t:'daily',x:'Quarta. Deuteronômio, capítulo 4, versículos 5 e 6; e Salmo 25, versículo 14. A Palavra de Deus orienta-nos a uma vida sábia e testemunhal.'},
{t:'daily',x:'Quinta. Deuteronômio, capítulo 4, versículos 8 e 9; e Mateus, capítulo 4, versículo 4. Guardar e transmitir a Palavra evita a infidelidade espiritual.'},
{t:'daily',x:'Sexta. Deuteronômio, capítulo 4, versículos 23 e 24; e Romanos, capítulo 1, versículo 25. A idolatria rompe a aliança e afronta o Deus zeloso.'},
{t:'daily',x:'Sábado. Deuteronômio, capítulo 4, versículos 29 e 31; e Primeira João, capítulo 1, versículo 9. O arrependimento sincero conduz ao perdão e à restauração.'},
{t:'label',x:'Leitura Bíblica em Classe.'},
{t:'versehead',x:'Deuteronômio, capítulo 4, versículos 1 a 4, e 25 a 31.'},
{t:'verse',x:'Versículo 1. Agora, pois, ó Israel, ouve os estatutos e os juízos que eu vos ensino, para os cumprirdes, para que vivais, e entreis, e possuais a terra que o SENHOR, Deus de vossos pais, vos dá.'},
{t:'verse',x:'Versículo 2. Nada acrescentareis à palavra que vos mando, nem diminuireis dela, para que guardeis os mandamentos do SENHOR, vosso Deus, que eu vos mando.'},
{t:'verse',x:'Versículo 3. Os vossos olhos têm visto o que o SENHOR fez por causa de Baal-Peor; pois a todo homem que seguiu a Baal-Peor o SENHOR, teu Deus, consumiu do meio de ti.'},
{t:'verse',x:'Versículo 4. Porém vós que vos chegastes ao SENHOR, vosso Deus, hoje todos estais vivos.'},
{t:'verse',x:'Versículo 25. Quando, pois, gerardes filhos e filhos de filhos, e vos envelhecerdes na terra, e vos corromperdes, e fizerdes alguma escultura, semelhança de alguma coisa, e fizerdes mal aos olhos do SENHOR, para o provocar à ira,'},
{t:'verse',x:'Versículo 26. hoje, tomo por testemunhas contra vós o céu e a terra, que certamente perecereis depressa da terra, a qual, passado o Jordão, ides possuir; não prolongareis os vossos dias nela; antes, sereis de todo destruídos.'},
{t:'verse',x:'Versículo 27. E o SENHOR vos espalhará entre os povos, e ficareis poucos em número entre as gentes às quais o SENHOR vos conduzirá.'},
{t:'verse',x:'Versículo 28. E ali servireis a deuses que são obra de mãos de homens, madeira e pedra, que não veem, nem ouvem, nem comem, nem cheiram.'},
{t:'verse',x:'Versículo 29. Então, dali, buscarás ao SENHOR, teu Deus, e o acharás, quando o buscares de todo o teu coração e de toda a tua alma.'},
{t:'verse',x:'Versículo 30. Quando estiveres em angústia, e todas estas coisas te alcançarem, então, no fim de dias, te virarás para o SENHOR, teu Deus, e ouvirás a sua voz.'},
{t:'verse',x:'Versículo 31. Porquanto o SENHOR, teu Deus, é Deus misericordioso; e não te desamparará, nem te destruirá, nem se esquecerá do concerto que jurou a teus pais.'},
{t:'body',x:'Hinos sugeridos: setenta e sete, trezentos e seis, e trezentos e setenta e sete, da Harpa Cristã.'},

{t:'divider',x:'Plano de Aula'},
{t:'subtopic',x:'1. Introdução.'},
{t:'body',x:'Nesta lição, estudaremos um dos grandes contrastes apresentados em Deuteronômio: a perfeita fidelidade de Deus diante da constante infidelidade de Israel. Moisés relembra ao povo que o Senhor permanece fiel à sua aliança mesmo quando o homem falha por meio da desobediência, idolatria e afastamento espiritual. Ao mesmo tempo, a lição destaca que Deus requer obediência sincera, apego à sua Palavra e rejeição de toda forma de idolatria.'},
{t:'subtopic',x:'2. Apresentação da Lição.'},
{t:'body',x:'Objetivos da Lição. Primeiro, destacar a fidelidade divina e o chamado à obediência. Segundo, alertar sobre os perigos da idolatria e da infidelidade. Terceiro, levar a classe a reconhecer a misericórdia de Deus na restauração do povo.'},
{t:'body',x:'Motivação. A Palavra de Deus revela que a fidelidade de Deus permanece inabalável mesmo em tempos de infidelidade. Contudo, a presente lição desafia cada aluno a valorizar a Palavra, rejeitar toda forma de idolatria e viver em sincera obediência ao Senhor.'},
{t:'body',x:'Sugestão de Método. Para concluir a aula de maneira marcante, proponha um momento de reflexão silenciosa. Peça a cada aluno que responda mentalmente ou em um papel: Existe algo ocupando o lugar de Deus em minha vida? Em seguida, relembre que Israel perdeu o senso da aliança quando permitiu que a idolatria substituísse a fidelidade ao Senhor. Leia Deuteronômio, capítulo 4, versículo 29, e destaque que Deus continua pronto a receber aqueles que o buscam de todo o coração. Finalize com uma oração e convide a classe a renovar o seu compromisso com a Palavra, a obediência e a fidelidade ao único e verdadeiro Deus.'},
{t:'subtopic',x:'3. Conclusão da Lição.'},
{t:'body',x:'Aplicação. A fidelidade de Deus permanece firme mesmo diante das falhas humanas. Por isso, devemos guardar a sua Palavra, rejeitar toda forma de idolatria e viver em obediência sincera. Quem busca ao Senhor de todo o coração encontra graça, perdão, direção e restauração espiritual.'},
{t:'subtopic',x:'4. Subsídio ao Professor.'},
{t:'body',x:'Revista Ensinador Cristão. Vale a pena conhecer essa revista que traz reportagens, artigos, entrevistas e subsídios de apoio às Lições Bíblicas Adultos. Na edição cento e sete, página trinta e sete, você encontrará um subsídio especial para esta lição.'},
{t:'body',x:'Auxílios Especiais. Ao fim do tópico, você encontrará auxílios que darão suporte na preparação de sua aula. Primeiro, o texto Não se Esqueça de Tudo o que Deus Fez, localizado depois do primeiro tópico, aprofunda o tema da fidelidade de Deus. Segundo, o texto Garantia de Sucesso Espiritual, localizado ao fim do segundo tópico, contribui sobre os temas da idolatria e da infidelidade espiritual.'},

{t:'divider',x:'Comentário'},
{t:'label',x:'Introdução.'},
{t:'body',x:'A fidelidade de Deus é um dos atributos mais sublimes do seu caráter: Ele não mente e não falha. Deuteronômio, capítulo 7, versículo 9; e Hebreus, capítulo 10, versículo 23. Fiel em essência, permanece constante, independentemente das circunstâncias humanas. Segunda Timóteo, capítulo 2, versículo 13; e Tiago, capítulo 1, versículo 17. Em contraste, a história de Israel revela um quadro de infidelidade recorrente, marcado pela desobediência, idolatria e afastamento da aliança. Salmo 78, versículo 37; e Jeremias, capítulo 2, versículo 13. Ainda assim, o Senhor permanece justo e digno de confiança. Nesta lição, ainda dentro do primeiro discurso de Moisés, estudaremos a fidelidade de Deus diante da infidelidade do povo de Israel.'},
{t:'label',x:'Palavra-chave.'},
{t:'body',x:'Fidelidade.'},

{t:'topic',x:'Tópico 1. A Aliança de Deus e a sua Fidelidade.'},
{t:'subtopic',x:'1. A fidelidade de Deus e o apelo à obediência.'},
{t:'body',x:'A primeira parte de Deuteronômio apresenta uma revisão histórica conduzida por Moisés, cujo propósito é exortar o povo à fidelidade à aliança e afastá-lo da idolatria e da desobediência. Em Deuteronômio, capítulo 4, evidencia-se o seu coração pastoral ao conclamar a nova geração a não repetir os erros da anterior. Deuteronômio, capítulo 4, versículos 1 e 2. O texto ressalta um contraste marcante: Deus permanece fiel, enquanto Israel mostra-se repetidamente infiel. Deuteronômio, capítulo 7, versículo 9. Essa mensagem é profundamente atual, pois chama o crente a viver em obediência, temor e gratidão. Moisés enfatiza que a Palavra de Deus deve ser ouvida, guardada e praticada sem acréscimos ou distorções, Deuteronômio, capítulo 4, versículo 2, pois nela está a direção para uma vida íntegra. Em um tempo de relativização da verdade, somos desafiados a preservar a pureza das Escrituras e a viver conforme os seus princípios eternos, convictos de que Deus cumpre fielmente todas as suas promessas.'},
{t:'subtopic',x:'2. A relevância da disciplina divina.'},
{t:'body',x:'Tendo sido ressaltada a fidelidade de Deus e o chamado à obediência à sua Palavra, Moisés avança na sua exortação e mostra que a disciplina divina revela a justiça e o amor de Deus, que conduz o seu povo à obediência. Deuteronômio, capítulo 4, versículos 3 e 4. Israel conhecia o juízo ocorrido em Baal-Peor, Números, capítulo 25, versículos 1 a 9, quando a idolatria trouxe morte aos infiéis, enquanto os obedientes foram preservados. A nova geração é chamada a aprender com esse exemplo e a viver uma vida sábia que resulta em obediência. Deuteronômio, capítulo 4, versículo 6. Assim, a disciplina não visa destruição, e sim correção, proteção e vida para os que permanecem fiéis ao Senhor.'},
{t:'subtopic',x:'3. A vontade de Deus revelada na sua Palavra.'},
{t:'body',x:'Moisés relembra que as leis dadas a Israel não são invenções humanas, mas revelações divinas que expressam a vontade de Deus. Por meio delas, o povo conhecia o Senhor e aprendia a viver de forma justa. Nenhuma nação possuía um Deus tão próximo. Deuteronômio, capítulo 4, versículo 7. Assim, o Senhor não deixa o seu povo sem direção, mas guia-o por meio da sua Palavra e revela os seus caminhos aos que o temem. Salmo 25, versículo 14. Cristo, como a Palavra revelada de Deus, conduz-nos à vida eterna. João, capítulo 14, versículo 6.'},
{t:'label',x:'Ampliando o Conhecimento.'},
{t:'body',x:'Sinai, Monte, também chamado Horebe. O monte onde Moisés encontrou-se com Deus, o Senhor, e recebeu a Lei e as instruções para a construção do Tabernáculo. É importante observar que o Sinai é, às vezes, chamado de Horebe. A localização exata do monte não pode ser determinada ao certo. Para complicar as coisas, há o fato de que o deserto e a península em que se situam os montes são chamados de Sinai. Amplie mais seu conhecimento consultando o Dicionário Bíblico Baker, editado pela CPAD, página quatrocentos e sessenta e oito.'},
{t:'label',x:'Sinopse 1.'},
{t:'body',x:'Deus permanece fiel e chama seu povo à obediência sincera.'},
{t:'aux',label:'Auxílio Bibliológico. Não se Esqueça de Tudo o que Deus Fez.',x:'Moisés desejava que os israelitas jamais se esquecessem de tudo o que haviam visto Deus realizar. Por isso, orientou os pais a transmitirem aos seus filhos a memória dos grandes feitos do Senhor. Essa prática fortalecia, na geração presente, a lembrança da fidelidade divina e, ao mesmo tempo, despertava nas gerações futuras o compromisso de preservar e anunciar as obras poderosas de Deus. Ainda hoje, é fácil perder de vista as maravilhas que o Senhor realiza em favor do seu povo. Entretanto, a fidelidade de Deus permanece viva quando compartilhamos com outros os testemunhos de sua atuação em nossa vida e na vida daqueles que nos cercam. Bíblia de Estudo Aplicação Pessoal. Rio de Janeiro, CPAD, dois mil e dezessete, página duzentos e trinta e sete.'},

{t:'topic',x:'Tópico 2. A Infidelidade de Israel ao Longo da História.'},
{t:'subtopic',x:'1. Relembrando a revelação divina: a base da aliança.'},
{t:'body',x:'Moisés relembra ao povo que a Lei não deveria ser esquecida, mas constantemente recordada. Foi em Horebe que Deus revelou a sua vontade sem qualquer forma visível, evitando toda idolatria. O povo ouviu a sua voz e recebeu os mandamentos que firmaram o concerto; logo, cada geração deveria guardar e transmitir essa revelação. Deuteronômio, capítulo 4, versículo 9. Deveria, também, lembrar-se de que a infidelidade começa quando se esquece da Palavra. Cristo também confirmou esse princípio. Mateus, capítulo 4, versículos 1 a 10.'},
{t:'subtopic',x:'2. Não devemos corromper a revelação com a idolatria.'},
{t:'body',x:'Moisés adverte Israel contra a idolatria e lembra que Deus não se revelou por imagens. Deuteronômio, capítulo 4, versículo 15. O coração pecaminoso tende a trocar o Criador pelos seres criados, Romanos, capítulo 1, versículo 25, razão por que o povo deveria evitar toda forma de culto a imagens, astros ou criaturas. A idolatria rompe a aliança e afronta o Deus zeloso. Deuteronômio, capítulo 4, versículo 24. Hoje, ela também se manifesta em tudo o que ocupa o lugar de Deus. Devemos, portanto, vigiar e guardar-nos dos ídolos. Primeira João, capítulo 5, versículo 21.'},
{t:'subtopic',x:'3. Tratados conforme a revelação divina.'},
{t:'body',x:'Deus trata o homem conforme a resposta deste à sua Palavra: a obediência conduz à vida, e a desobediência, ao juízo. Moisés alerta que a rejeição da aliança resultaria em decadência espiritual e perda das bênçãos, levando o povo à dispersão e à servidão. Deuteronômio, capítulo 4, versículo 27. Deus é justo e não deixa o pecado impune. Números, capítulo 32, versículo 23. Assim, somos chamados a considerar a sua bondade e severidade e lembrar de que tudo o que o homem semear, isso também ceifará. Gálatas, capítulo 6, versículo 7.'},
{t:'label',x:'Sinopse 2.'},
{t:'body',x:'A idolatria e a infidelidade afastam o povo da aliança com Deus.'},
{t:'aux',label:'Auxílio Devocional. Garantia de Sucesso Espiritual.',x:'O que você ouviria em uma das gravações de Moisés, ou em um dos seus seminários? Provavelmente alguma coisa parecida com isso. Primeiro: Guarda os mandamentos do Senhor. Deuteronômio, capítulo 4, versículo 2. Esta é uma diretriz segura para se viver uma vida boa! Segundo: Guarda-te a ti mesmo e guarda bem a tua alma, que te não esqueças daquelas coisas que os teus olhos têm visto, e se não apartem do teu coração todos os dias da tua vida. Deuteronômio, capítulo 4, versículo 9. Reveja o que Deus faz por você todos os dias e, assim, você ficará motivado! Terceiro: E as farás saber a teus filhos e aos filhos de teus filhos. Deuteronômio, capítulo 4, versículo 9. Conte aos outros aquilo que Deus significa para você; isso deixará a sua fé sempre renovada, e fará de Deus uma realidade para as pessoas que estiverem à sua volta. Quarto: Guarda, pois, com diligência a vossa alma para que não vos corrompais. Deuteronômio, capítulo 4, versículos 15 e 16. Não se deixe enganar, qualquer um pode escorregar e cair. Nunca dê a qualquer ídolo, seja riqueza, poder, amor ou até boas obras, o lugar central que somente Deus tem o direito de ocupar em sua vida. É claro que eu não posso saber se as gravações de Moisés e seus seminários teriam boa acolhida no mercado. Veja, as pessoas estão sempre procurando uma maneira fácil de alcançar sucesso. Naquilo que concerne ao sucesso espiritual, não existe nenhuma maneira fácil. Richards, Lawrence O. Comentário Devocional da Bíblia. Rio de Janeiro, CPAD, dois mil e doze, página cento e nove.'},

{t:'topic',x:'Tópico 3. Deus não se Esquece do seu Concerto.'},
{t:'subtopic',x:'1. Ele é misericordioso.'},
{t:'body',x:'As Escrituras revelam que o Senhor é santo e justo, mas também misericordioso e fiel ao seu concerto. Deuteronômio, capítulo 4, versículo 31. Moisés antevê a infidelidade de Israel, Deuteronômio, capítulo 4, versículos 30 e 31, mas afirma que Deus não despreza o coração quebrantado e sinceramente arrependido. Salmo 51, versículo 17. Embora o homem seja vacilante, o Senhor permanece imutável. Há graça, perdão e restauração aos que se voltam para Ele. Segunda Crônicas, capítulo 7, versículo 14; e Primeira João, capítulo 1, versículo 9.'},
{t:'subtopic',x:'2. O valor das experiências com Deus.'},
{t:'body',x:'Moisés exalta a grandeza de Deus ao lembrar-se das experiências únicas vividas por Israel. Deuteronômio, capítulo 4, versículos 32 a 34. Por meio de perguntas retóricas, o profeta destaca que nenhuma nação ouviu Deus falar do meio do fogo, Deuteronômio, capítulo 4, versículo 33, nem foi libertada com tão grande poder. O Senhor operou sinais, maravilhas e atos poderosos, como no livramento do Egito. Êxodo, capítulo 6, versículo 6. Essas experiências revelam a sua onipotência e confirmam o privilégio de um povo separado para si.'},
{t:'subtopic',x:'3. O privilégio de conhecer a Deus e honrá-lo com obediência.'},
{t:'body',x:'O Senhor concedeu a Israel privilégios não por mérito, mas por amor, revelando-se como único e verdadeiro. Deuteronômio, capítulo 4, versículo 35. Ele chamou o povo a viver segundo os seus mandamentos e a desfrutar da sua presença e direção. Esse privilégio, contudo, exigia resposta: honrá-lo com obediência sincera e consciente. Deuteronômio, capítulo 4, versículos 39 e 40. A bênção estava condicionada à fidelidade à aliança. Hoje, também somos chamados a reconhecer a sua soberania e a guardar a sua Palavra. Quem vive em obediência experimenta a presença de Deus e desfruta de uma vida abençoada.'},
{t:'label',x:'Sinopse 3.'},
{t:'body',x:'Deus não abandona o seu povo e oferece perdão ao arrependido.'},

{t:'divider',x:'Conclusão'},
{t:'body',x:'Vimos que Moisés evidencia que o Senhor permanece fiel mesmo quando o seu povo falha. Ele abençoa os que obedecem e disciplina os que desobedecem. Se, portanto, desejamos permanecer na aliança com Deus, precisamos viver em obediência aos seus mandamentos. E, se houver falha na caminhada em algum momento, mas voltarmo-nos para Ele com o coração sincero e arrependido, encontraremos perdão, pois o seu amor é imutável. Assim como Israel foi chamado à fidelidade, também somos convocados a guardar a Palavra de Deus, a rejeitar o pecado e toda forma de idolatria e a viver plenamente a aliança firmada pelo sangue de Cristo.'},

{t:'divider',x:'Revisando o Conteúdo'},
{t:'subtopic',x:'Pergunta 1.'},
{t:'body',x:'O que Deuteronômio, capítulo 4, evidencia e ressalta? Evidencia-se o seu coração pastoral ao conclamar a nova geração a não repetir os erros da anterior. O texto ressalta um contraste marcante: Deus permanece fiel, enquanto Israel repetidamente se mostra infiel. Deuteronômio, capítulo 7, versículo 9.'},
{t:'subtopic',x:'Pergunta 2.'},
{t:'body',x:'O que a disciplina mostrada por Moisés revela? Moisés avança na sua exortação e mostra que a disciplina divina revela a justiça e o amor de Deus, que conduz seu povo à obediência.'},
{t:'subtopic',x:'Pergunta 3.'},
{t:'body',x:'De acordo com a lição, como Deus trata o homem? Deus trata o homem conforme a sua resposta à sua Palavra: a obediência conduz à vida, e a desobediência, ao juízo.'},
{t:'subtopic',x:'Pergunta 4.'},
{t:'body',x:'Como as Escrituras apresentam o Senhor Deus? As Escrituras revelam Deus como santo e justo, mas também misericordioso, fiel ao seu concerto.'},
{t:'subtopic',x:'Pergunta 5.'},
{t:'body',x:'O que Moisés destaca por meio de perguntas retóricas? Por meio de perguntas retóricas, Moisés destaca que nenhuma nação ouviu Deus falar do meio do fogo, Deuteronômio, capítulo 4, versículo 33, nem foi libertada com tão grande poder.'}
];

const reader=document.getElementById('reader'),segs=[];
function tok(el,text){let pos=0;text.split(/(\s+)/).forEach(p=>{if(!p)return;if(/^\s+$/.test(p)){el.appendChild(document.createTextNode(p))}else{const w=document.createElement('span');w.className='w';w.textContent=p;w.dataset.s=pos;w.dataset.e=pos+p.length;el.appendChild(w)}pos+=p.length})}
function mk(cls,text,parent){const d=document.createElement('div');d.className='seg '+cls;d.tabIndex=0;tok(d,text);parent.appendChild(d);segs.push(d);return d}
DATA.forEach(i=>{
 if(i.t==='divider'){const d=document.createElement('div');d.className='div';d.innerHTML='<span></span>';d.firstChild.textContent=i.x;reader.appendChild(d);return}
 if(i.t==='aux'){const b=document.createElement('div');b.className='aux';mk('label',i.label,b);mk('body',i.x,b).style.fontStyle='italic';reader.appendChild(b);return}
 mk(i.t,i.x,reader);
});

const synth=window.speechSynthesis;let voices=[],cur=0,playing=false,stopped=true;
const $=id=>document.getElementById(id),play=$('play'),pause=$('pause'),stop=$('stop'),rate=$('rate'),voice=$('voice'),st=$('status');
if(!synth){st.textContent='Seu navegador não suporta leitura em voz alta.';play.disabled=true}
function loadV(){voices=synth.getVoices();const pt=voices.filter(v=>/pt/i.test(v.lang)),l=pt.length?pt:voices;voice.innerHTML='';l.forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=v.name+' ['+v.lang+']';voice.appendChild(o)});const br=l.find(v=>/pt.?br/i.test(v.lang));if(br)voice.value=br.name}
if(synth){loadV();synth.onvoiceschanged=loadV}
const clrW=e=>e&&e.querySelectorAll('.w.spoken').forEach(w=>w.classList.remove('spoken'));
const clrA=()=>segs.forEach(s=>{s.classList.remove('active');clrW(s)});
function speak(i){
 if(i>=segs.length){finish();return}
 cur=i;const el=segs[i];clrA();el.classList.add('active');el.scrollIntoView({behavior:'smooth',block:'center'});
 const u=new SpeechSynthesisUtterance(el.textContent.trim()),v=voices.find(x=>x.name===voice.value);
 if(v)u.voice=v;u.lang=(v&&v.lang)||'pt-BR';u.rate=parseFloat(rate.value);
 const ws=[...el.querySelectorAll('.w')];
 u.onboundary=e=>{if(e.charIndex==null)return;clrW(el);const h=ws.find(w=>e.charIndex<+w.dataset.e);if(h)h.classList.add('spoken')};
 u.onend=()=>{clrW(el);if(!stopped)speak(i+1)};
 u.onerror=()=>{if(!stopped)speak(i+1)};
 st.textContent='Lendo… trecho '+(i+1)+' de '+segs.length;synth.speak(u);
}
function start(i){stopped=false;playing=true;synth.cancel();play.disabled=true;pause.disabled=false;stop.disabled=false;pause.textContent='⏸ Pausar';speak(i==null?cur:i)}
function finish(){playing=false;stopped=true;clrA();play.disabled=false;pause.disabled=true;stop.disabled=true;st.textContent='Leitura concluída.';cur=0}
play.onclick=()=>start(cur);
pause.onclick=()=>{if(synth.paused){synth.resume();pause.textContent='⏸ Pausar';st.textContent='Retomando…'}else{synth.pause();pause.textContent='▶ Continuar';st.textContent='Pausado.'}};
stop.onclick=()=>{stopped=true;synth.cancel();finish();st.textContent='Parado.'};
rate.oninput=()=>{$('rv').textContent=parseFloat(rate.value).toFixed(2)+'×'};
segs.forEach((el,i)=>{el.onclick=()=>start(i);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();start(i)}}});
addEventListener('beforeunload',()=>{try{synth.cancel()}catch(e){}});
</script>
